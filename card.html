<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farrukh Khujamkulov — Deputy Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#EDF2FA; --trace:rgba(1,60,140,.16); --pulse:#1F6FEB; --node-stroke:rgba(1,60,140,.35);
  --ink:#0B1F3F; --muted:#5B6B86; --brand:#013C8C; --hover:#EAF1FD; --line:#DCE5F3;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg:#050E24; --trace:rgba(110,160,240,.2); --pulse:#6FA8FF; --node-stroke:rgba(110,160,240,.45); }
}
:root[data-theme="dark"] { --bg:#050E24; --trace:rgba(110,160,240,.2); --pulse:#6FA8FF; --node-stroke:rgba(110,160,240,.45); }
html { height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after { box-sizing:inherit; }
body {
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Barlow","DIN Alternate","Bahnschrift","Segoe UI",system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:24px 16px; overflow-x:hidden;
}
.bg { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
.tr,.pl { fill:none; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
.tr { stroke:var(--trace); }
.pl { stroke:var(--pulse); stroke-dasharray:60 1000; stroke-dashoffset:60; opacity:.9;
  animation:run linear infinite; filter:drop-shadow(0 0 4px var(--pulse)); }
.nd { fill:var(--bg); stroke:var(--node-stroke); stroke-width:3; }
@keyframes run { from { stroke-dashoffset:60; } to { stroke-dashoffset:-1000; } }
.card {
  position:relative; width:100%; max-width:440px; background:#fff; color:#0B1F3F; border-radius:18px;
  padding:34px 28px 18px; box-shadow:0 1px 0 rgba(1,60,140,.06), 0 24px 60px -20px rgba(1,60,140,.35);
}
.logo { display:block; width:100%; max-width:300px; height:auto; margin:0 auto 26px; }
.who { padding:22px 6px 20px; border-top:1px solid var(--line); }
h1 { margin:0; font-size:31px; line-height:1.1; font-weight:600; letter-spacing:.01em; }
h1 span { text-transform:uppercase; letter-spacing:.03em; }
.role { margin:6px 0 0; font-size:19px; font-weight:500; color:var(--muted); }
.links { display:grid; gap:2px; }
.links a {
  display:flex; align-items:center; gap:14px; padding:14px 6px; border-radius:12px;
  color:inherit; text-decoration:none; font-size:21px; font-weight:500; word-break:break-all;
  transition:background .15s;
}
.links a:hover { background:var(--hover); }
.links a:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
.ic { flex:none; width:40px; height:40px; border-radius:50%; border:2px solid var(--brand); color:var(--brand);
  display:grid; place-items:center; }
.ic svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
@media (prefers-reduced-motion: reduce) { .pl { animation:none; opacity:0; } }
</style>
</head>
